<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111728"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Seal Gradient -->
    <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Subtle Guilloche / Grid Pattern Background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="certGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40"/>
    </pattern>
    <rect width="1200" height="850" fill="url(#certGrid)"/>
  </g>

  <!-- Outer Frame -->
  <rect x="35" y="35" width="1130" height="780" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>
  <rect x="47" y="47" width="1106" height="756" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <rect x="55" y="55" width="1090" height="740" rx="10" fill="none" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 35 90 C 70 90, 90 70, 90 35"/>
    <path d="M 35 105 C 85 105, 105 85, 105 35"/>
    <circle cx="75" cy="75" r="4" fill="url(#goldGrad)"/>

    <!-- Top-Right -->
    <path d="M 1165 90 C 1130 90, 1110 70, 1110 35"/>
    <path d="M 1165 105 C 1115 105, 1095 85, 1095 35"/>
    <circle cx="1125" cy="75" r="4" fill="url(#goldGrad)"/>

    <!-- Bottom-Left -->
    <path d="M 35 760 C 70 760, 90 780, 90 815"/>
    <path d="M 35 745 C 85 745, 105 765, 105 815"/>
    <circle cx="75" cy="775" r="4" fill="url(#goldGrad)"/>

    <!-- Bottom-Right -->
    <path d="M 1165 760 C 1130 760, 1110 780, 1110 815"/>
    <path d="M 1165 745 C 1115 745, 1095 765, 1095 815"/>
    <circle cx="1125" cy="775" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Institution Branding Header -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Codebrave Badge Icon -->
    <rect x="-30" y="-38" width="60" height="36" rx="8" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="-14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">&lt;CB/&gt;</text>
    
    <text x="0" y="24" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="6">CODEBRAVE</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="3">ACADEMY &amp; TECH EDUCATION</text>
  </g>

  <!-- Title Section -->
  <g transform="translate(600, 245)" text-anchor="middle">
    <text x="0" y="0" fill="url(#goldGrad)" font-family="'Inter', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" filter="url(#goldGlow)">CERTIFICATE OF COMPLETION</text>
    <line x1="-160" y1="18" x2="160" y2="18" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,15 -6,18 0,21 6,18" fill="#fde68a"/>
    <text x="0" y="48" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="4">THIS CERTIFIES THAT</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1">YOUSEF ABDALLAH</text>
    <line x1="-280" y1="20" x2="280" y2="20" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="-280" cy="20" r="3" fill="#fde68a"/>
    <circle cx="280" cy="20" r="3" fill="#fde68a"/>
  </g>

  <!-- Program Details -->
  <g transform="translate(600, 435)" text-anchor="middle">
    <text x="0" y="0" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400">has successfully completed the intensive curriculum for the</text>
    <text x="0" y="38" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="1">Python &amp; Web Development Program</text>
    
    <text x="0" y="80" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" width="700">
      <tspan x="0" dy="0">Demonstrating technical competency in full-stack architecture, Python programming,</tspan>
      <tspan x="0" dy="22">modern web frameworks, REST APIs, Git workflows, and database integration.</tspan>
    </text>
  </g>

  <!-- Skills Ribbon Badges -->
  <g transform="translate(600, 575)" text-anchor="middle">
    <rect x="-320" y="-16" width="640" height="32" rx="16" fill="#131d31" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">
      FULL-STACK WEB DEV • PYTHON • REST APIS • SOFTWARE ARCHITECTURE
    </text>
  </g>

  <!-- Footer Elements: Signatures & Gold Seal -->
  <!-- Left Signature -->
  <g transform="translate(240, 690)">
    <path d="M 0 0 C 30 -25, 60 10, 90 -15 C 120 15, 140 -20, 180 -5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <line x1="-10" y1="12" x2="200" y2="12" stroke="#475569" stroke-width="1"/>
    <text x="95" y="30" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Program Director</text>
    <text x="95" y="46" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Codebrave Academy</text>
  </g>

  <!-- Center Gold Embossed Seal -->
  <g transform="translate(600, 700)">
    <!-- Ribbons -->
    <path d="M -22 35 L -35 85 L 0 65 L 35 85 L 22 35 Z" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <!-- Outer Star Burst Seal -->
    <circle cx="0" cy="0" r="54" fill="url(#sealGrad)" filter="url(#goldGlow)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <!-- Seal Content -->
    <text x="0" y="-12" fill="#fde68a" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" text-anchor="middle">VERIFIED</text>
    <text x="0" y="3" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">EXCELLENCE</text>
    <text x="0" y="16" fill="#fde68a" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">★ CREDENTIAL ★</text>
  </g>

  <!-- Right Signature / Verification -->
  <g transform="translate(960, 690)">
    <path d="M -180 -10 C -150 15, -120 -20, -90 5 C -60 -15, -30 10, 0 -5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <line x1="-190" y1="12" x2="20" y2="12" stroke="#475569" stroke-width="1"/>
    <text x="-85" y="30" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lead Instructor</text>
    <text x="-85" y="46" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Software Engineering Faculty</text>
  </g>

  <!-- Bottom Verification ID -->
  <text x="600" y="805" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="2">
    CREDENTIAL ID: CB-DEV-2024-YA982 • VERIFIED ACADEMIC RECORD
  </text>
</svg>