<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091319"/>
      <stop offset="50%" stop-color="#0f1f2c"/>
      <stop offset="100%" stop-color="#050b10"/>
    </linearGradient>

    <!-- Emerald / Mint Accent Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="25%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="75%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradLN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- AI Neural Network Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="850" fill="url(#bgGradLN)"/>

  <!-- Neural Mesh Background Accents -->
  <g opacity="0.05" stroke="#10b981" stroke-width="1">
    <circle cx="200" cy="200" r="120" fill="none"/>
    <circle cx="1000" cy="200" r="120" fill="none"/>
    <circle cx="200" cy="650" r="120" fill="none"/>
    <circle cx="1000" cy="650" r="120" fill="none"/>
    <line x1="200" y1="200" x2="600" y2="425"/>
    <line x1="1000" y1="200" x2="600" y2="425"/>
    <line x1="200" y1="650" x2="600" y2="425"/>
    <line x1="1000" y1="650" x2="600" y2="425"/>
  </g>

  <!-- Outer Frame -->
  <rect x="35" y="35" width="1130" height="780" rx="16" fill="none" stroke="url(#mintGrad)" stroke-width="3" opacity="0.85"/>
  <rect x="47" y="47" width="1106" height="756" rx="12" fill="none" stroke="url(#mintGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <rect x="55" y="55" width="1090" height="740" rx="10" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Corner Tech Brackets -->
  <g stroke="url(#mintGrad)" stroke-width="2.5" fill="none">
    <!-- Top-Left -->
    <path d="M 35 110 L 35 35 L 110 35"/>
    <circle cx="75" cy="75" r="4" fill="url(#mintGrad)"/>
    <!-- Top-Right -->
    <path d="M 1165 110 L 1165 35 L 1090 35"/>
    <circle cx="1125" cy="75" r="4" fill="url(#mintGrad)"/>
    <!-- Bottom-Left -->
    <path d="M 35 740 L 35 815 L 110 815"/>
    <circle cx="75" cy="775" r="4" fill="url(#mintGrad)"/>
    <!-- Bottom-Right -->
    <path d="M 1165 740 L 1165 815 L 1090 815"/>
    <circle cx="1125" cy="775" r="4" fill="url(#mintGrad)"/>
  </g>

  <!-- Institution Branding Header -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- LebNet Cedar / Tech Logo -->
    <rect x="-32" y="-38" width="64" height="36" rx="8" fill="#064e3b" stroke="url(#mintGrad)" stroke-width="1.5"/>
    <text x="0" y="-14" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">AI • LN</text>
    
    <text x="0" y="24" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="6">LEBNET</text>
    <text x="0" y="44" fill="#6ee7b7" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="3">TECH FELLOWS PROGRAM</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 245)" text-anchor="middle">
    <text x="0" y="0" fill="url(#goldGradLN)" font-family="'Inter', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" filter="url(#emeraldGlow)">FELLOWSHIP CERTIFICATE</text>
    <line x1="-180" y1="18" x2="180" y2="18" stroke="url(#mintGrad)" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,15 -6,18 0,21 6,18" fill="#6ee7b7"/>
    <text x="0" y="48" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="4">THIS FELLOWSHIP IS CONFERRED UPON</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1">YOUSEF ABDALLAH</text>
    <line x1="-280" y1="20" x2="280" y2="20" stroke="url(#mintGrad)" stroke-width="2"/>
    <circle cx="-280" cy="20" r="3" fill="#6ee7b7"/>
    <circle cx="280" cy="20" r="3" fill="#6ee7b7"/>
  </g>

  <!-- Program Details -->
  <g transform="translate(600, 435)" text-anchor="middle">
    <text x="0" y="0" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400">in recognition of outstanding completion of the selective</text>
    <text x="0" y="38" fill="#10b981" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="1">LebNet Tech Fellows AI Program</text>
    
    <text x="0" y="80" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400">
      <tspan x="0" dy="0">Mastering deep neural networks, computer vision, PyTorch architecture design, transfer learning,</tspan>
      <tspan x="0" dy="22">and developing end-to-end production machine learning diagnostic models with FastAPI.</tspan>
    </text>
  </g>

  <!-- Skills Ribbon Badges -->
  <g transform="translate(600, 575)" text-anchor="middle">
    <rect x="-330" y="-16" width="660" height="32" rx="16" fill="#062e22" stroke="#059669" stroke-width="1"/>
    <text x="0" y="5" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">
      ARTIFICIAL INTELLIGENCE • PYTORCH • COMPUTER VISION • DEEP LEARNING • FASTAPI
    </text>
  </g>

  <!-- Footer Elements: Signatures & Embossed Seal -->
  <!-- Left Signature -->
  <g transform="translate(240, 690)">
    <path d="M 0 0 C 30 -20, 60 15, 90 -10 C 120 20, 140 -15, 180 0" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
    <line x1="-10" y1="12" x2="200" y2="12" stroke="#334155" stroke-width="1"/>
    <text x="95" y="30" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fellowship Director</text>
    <text x="95" y="46" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">LebNet Tech Fellows Council</text>
  </g>

  <!-- Center Seal -->
  <g transform="translate(600, 700)">
    <!-- Ribbons -->
    <path d="M -22 35 L -35 85 L 0 65 L 35 85 L 22 35 Z" fill="#047857" stroke="#064e3b" stroke-width="1"/>
    <!-- Outer Star Burst Seal -->
    <circle cx="0" cy="0" r="54" fill="url(#mintGrad)" filter="url(#emeraldGlow)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="42" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
    <!-- Seal Content -->
    <text x="0" y="-12" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="1.5" text-anchor="middle">LEBNET FELLOW</text>
    <text x="0" y="3" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">AI FELLOWSHIP</text>
    <text x="0" y="16" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">★ HONORS ★</text>
  </g>

  <!-- Right Signature / Verification -->
  <g transform="translate(960, 690)">
    <path d="M -180 -5 C -150 20, -120 -15, -90 10 C -60 -10, -30 15, 0 0" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
    <line x1="-190" y1="12" x2="20" y2="12" stroke="#334155" stroke-width="1"/>
    <text x="-85" y="30" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AI Program Lead</text>
    <text x="-85" y="46" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="11" text-anchor="middle">Applied AI &amp; Research Track</text>
  </g>

  <!-- Bottom Verification ID -->
  <text x="600" y="805" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" letter-spacing="2">
    FELLOWSHIP ID: LN-AIF-2024-YA741 • VERIFIED CREDENTIAL
  </text>
</svg>