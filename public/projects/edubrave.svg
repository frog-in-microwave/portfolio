<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="16" />

  <!-- Ambient Glow -->
  <circle cx="650" cy="120" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="350" r="180" fill="#059669" opacity="0.1" filter="url(#glow)" />

  <!-- Window Frame -->
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#090e17" stroke="#1e293b" stroke-width="2" />
  
  <!-- Window Header -->
  <rect x="60" y="50" width="680" height="40" rx="12" fill="#0f172a" />
  <circle cx="85" cy="70" r="5" fill="#ef4444" />
  <circle cx="102" cy="70" r="5" fill="#f59e0b" />
  <circle cx="119" cy="70" r="5" fill="#10b981" />
  <text x="400" y="74" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">edubrave-portal.internal/dashboard</text>

  <!-- Sidebar -->
  <rect x="60" y="90" width="160" height="310" fill="#0c121e" />
  <rect x="75" y="110" width="130" height="28" rx="6" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="90" y="128" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="bold">Cohorts &amp; Classes</text>
  <rect x="75" y="150" width="130" height="20" rx="4" fill="#1e293b" opacity="0.6" />
  <rect x="75" y="180" width="130" height="20" rx="4" fill="#1e293b" opacity="0.4" />
  <rect x="75" y="210" width="130" height="20" rx="4" fill="#1e293b" opacity="0.4" />

  <!-- Content Area: Stat Cards -->
  <rect x="240" y="110" width="150" height="70" rx="8" fill="#131d2e" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
  <text x="255" y="132" fill="#94a3b8" font-size="11" font-family="sans-serif">Enrolled Learners</text>
  <text x="255" y="162" fill="#ffffff" font-size="20" font-family="sans-serif" font-weight="bold">1,248</text>

  <rect x="405" y="110" width="150" height="70" rx="8" fill="#131d2e" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
  <text x="420" y="132" fill="#94a3b8" font-size="11" font-family="sans-serif">Attendance Rate</text>
  <text x="420" y="162" fill="#38bdf8" font-size="20" font-family="sans-serif" font-weight="bold">96.8%</text>

  <rect x="570" y="110" width="150" height="70" rx="8" fill="#131d2e" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
  <text x="585" y="132" fill="#94a3b8" font-size="11" font-family="sans-serif">Active Trainers</text>
  <text x="585" y="162" fill="#c084fc" font-size="20" font-family="sans-serif" font-weight="bold">34</text>

  <!-- Content Chart Area -->
  <rect x="240" y="200" width="480" height="180" rx="10" fill="#111927" stroke="#1e293b" stroke-width="1" />
  <text x="260" y="228" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="bold">Weekly Synchronized Attendance (GraphQL)</text>
  
  <!-- Line chart simulation -->
  <path d="M 260 340 L 330 300 L 400 320 L 480 270 L 560 250 L 640 280 L 700 240" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" />
  <circle cx="560" cy="250" r="5" fill="#34d399" />
  <circle cx="700" cy="240" r="5" fill="#34d399" />
</svg>
