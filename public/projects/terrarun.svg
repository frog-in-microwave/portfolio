<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="16" />

  <!-- Flowchart Nodes for GCP & Terraform -->
  <!-- 1. Git Commit -->
  <rect x="70" y="180" width="130" height="90" rx="12" fill="#18182f" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="135" cy="210" r="14" fill="#8b5cf6" opacity="0.3" />
  <text x="135" y="214" fill="#c084fc" font-size="12" font-family="monospace" text-anchor="middle">Git Push</text>
  <text x="135" y="245" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">IaC Trigger</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="225" x2="250" y2="225" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4" />
  <polygon points="255,225 245,220 245,230" fill="#8b5cf6" />

  <!-- 2. Terraform Plan & Validation -->
  <rect x="260" y="160" width="160" height="130" rx="12" fill="#1e1838" stroke="#a855f7" stroke-width="2" />
  <rect x="275" y="175" width="130" height="24" rx="6" fill="#a855f7" opacity="0.2" />
  <text x="340" y="191" fill="#d8b4fe" font-size="11" font-family="monospace" text-anchor="middle">Terraform Core</text>
  <text x="280" y="225" fill="#94a3b8" font-size="11" font-family="sans-serif">✔ Plan Validated</text>
  <text x="280" y="245" fill="#94a3b8" font-size="11" font-family="sans-serif">✔ IAM Least Privilege</text>
  <text x="280" y="265" fill="#94a3b8" font-size="11" font-family="sans-serif">✔ Infracost: $0 Drift</text>

  <!-- Arrow 2 -->
  <line x1="420" y1="225" x2="470" y2="225" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />
  <polygon points="475,225 465,220 465,230" fill="#a855f7" />

  <!-- 3. GCP Cloud Build -->
  <rect x="480" y="170" width="120" height="110" rx="12" fill="#18182f" stroke="#38bdf8" stroke-width="2" />
  <text x="540" y="210" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Cloud Build</text>
  <text x="540" y="235" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Docker Digest</text>
  <circle cx="540" cy="255" r="5" fill="#10b981" />

  <!-- Arrow 3 -->
  <line x1="600" y1="225" x2="640" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
  <polygon points="645,225 635,220 635,230" fill="#38bdf8" />

  <!-- 4. GCP Cloud Run Production -->
  <rect x="650" y="150" width="110" height="150" rx="12" fill="#09252c" stroke="#10b981" stroke-width="2" />
  <circle cx="705" cy="185" r="16" fill="#10b981" opacity="0.2" />
  <text x="705" y="190" fill="#34d399" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡</text>
  <text x="705" y="225" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Cloud Run</text>
  <text x="705" y="245" fill="#34d399" font-size="10" font-family="monospace" text-anchor="middle">0 Downtime</text>
  <text x="705" y="265" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Auto-Scale 0..10</text>
</svg>
